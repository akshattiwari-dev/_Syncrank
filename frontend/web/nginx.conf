server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing (React Router) needs every unknown
    # path to resolve to index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames from Vite's build -> safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached, or deploys won't show up for
    # returning visitors until their browser cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
